name: Mirror master

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    if: "!contains(github.repository, 'github.io')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push master to org
        env:
          MIRROR_TOKEN: ${{ secrets.BW_MIRROR_ACCESS }}
        run: |
          git clone --branch master --single-branch "https://x-access-token:${MIRROR_TOKEN}@GitHub.com/r0ute/bellwright-wiki.git" mirror
          git -C mirror push "https://x-access-token:${MIRROR_TOKEN}@GitHub.com/bellwright-wiki/bellwright-wiki.github.io.git" master:master
